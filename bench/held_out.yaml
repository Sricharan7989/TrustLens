version: 1
packages:
  # 5 Malicious packages held-out from rule/heuristic tuning
  - id: cli_payload
    path: bench/packages/malicious/cli_payload
    label: malicious
    category: planted
    trigger: cli
    gate: none
    obfuscation: none
    claim: "command-line file compression and archive helper"
    expected_verdict: MALICIOUS-EVIDENT
    expected_signals:
      - canary_access
      - network_unclaimed
    notes: "Held-out malicious package: console_scripts entry point reads ~/.ssh/id_rsa and contacts 198.51.100.11 when executed"

  - id: staged_dropper
    path: bench/packages/malicious/staged_dropper
    label: malicious
    category: planted
    trigger: call
    gate: none
    obfuscation: none
    claim: "lightweight HTTP asset downloader and cache manager that downloads files"
    expected_verdict: SUSPICIOUS
    expected_signals:
      - download_exec
    notes: "Held-out malicious package: fetches second-stage python script from http://payload.invalid/stage.py and executes it via exec(); claims downloader so network is licensed, single strong signal download_exec yields SUSPICIOUS"

  - id: env_harvester
    path: bench/packages/malicious/env_harvester
    label: malicious
    category: planted
    trigger: call
    gate: none
    obfuscation: none
    claim: "environment configuration parser and validator"
    expected_verdict: MALICIOUS-EVIDENT
    expected_signals:
      - canary_access
      - network_unclaimed
    notes: "Held-out malicious package: dumps os.environ looking for tokens and attempts DNS lookup exfil to exfil.invalid"

  - id: obfuscated_xor
    path: bench/packages/malicious/obfuscated_xor
    label: malicious
    category: planted
    trigger: call
    gate: none
    obfuscation: xor
    claim: "string cipher and token generator"
    expected_verdict: MALICIOUS-EVIDENT
    expected_signals:
      - decoded_exec
      - network_unclaimed
    notes: "Held-out malicious package: payload decoded via chr() and XOR key before dynamic compile/exec to contact 198.51.100.33"

  - id: time_gate
    path: bench/packages/malicious/time_gate
    label: malicious
    category: planted
    trigger: call
    gate: time
    obfuscation: none
    claim: "date and timestamp formatting utilities"
    expected_verdict: MALICIOUS-EVIDENT
    expected_signals:
      - env_differential
      - network_unclaimed
    notes: "Held-out malicious package: gate opens 2026-11-09; connects to 198.51.100.40 only under clock+30d variant"

