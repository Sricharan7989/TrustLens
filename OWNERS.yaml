# Disjoint file ownership. A path matches the FIRST owner whose glob matches (fnmatch or prefix). Keep in sync with AGENTS.md section 3.
owners:
  a:
    - "trustlens/sandbox/*"
    - "scripts/check_env.sh"
    - "tests/sandbox/*"
    - "docs/SANDBOX.md"
  b:
    - "trustlens/fingerprint/*"
    - "trustlens/claims/*"
    - "trustlens/engine/*"
    - "tests/engine/*"
    - "docs/ENGINE.md"
  c:
    - "bench/*"
    - "eval/*"
    - "scripts/fetch_*.sh"
    - "scripts/extract_in_sandbox.sh"
    - "tests/bench/*"
    - "docs/DATASETS.md"
  d:
    - "trustlens/cli.py"
    - "trustlens/__main__.py"
    - "trustlens/report/*"
    - "trustlens/webui/*"
    - "tests/e2e/*"
    - "Makefile"
    - "README.md"
    - "docs/ARCHITECTURE.md"
    - "docs/LIMITATIONS.md"
    - "docs/DEMO_SCRIPT.md"
    - "docs/PPT_OUTLINE.md"
    - "docs/PLAN.md"
    - "reports/*"
  lead:
    - "AGENTS.md"
    - "AUDIT.md"
    - "OWNERS.yaml"
    - "LICENSE"
    - "NOTICE"
    - ".gitignore"
    - ".github/*"
    - ".tool-versions"
    - "pyproject.toml"
    - "requirements*.txt"
    - "DEPENDENCIES.md"
    - "docs/CONTRACTS.md"
    - "schemas/*"
    - "prompts/*"
    - "tests/contracts/*"
    - "tests/__init__.py"
    - "tests/conftest.py"
    - "trustlens/__init__.py"
    - "trustlens/contracts.py"
    - "scripts/audit.sh"
    - "scripts/audit_contracts.py"
    - "scripts/make_examples.py"
    - "scripts/check_ownership.py"
    - "scripts/scan_secrets.sh"
    - "scripts/build_kit.sh"
